name: Publish signed APT repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to publish
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: apt-repository
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.prerelease == false && github.event.release.draft == false)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out repository publishing tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: repository-tools

      - name: Check out released driver source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build supported Debian packages
        run: |
          set -eu
          mkdir -p build/apt-packages
          for target in 'linux/amd64 amd64' 'linux/arm64 arm64' 'linux/arm/v7 armhf'; do
            set -- $target
            docker buildx build \
              --platform "$1" \
              --file release-source/debian/Dockerfile.test \
              --output "type=local,dest=build/apt-packages/$2" release-source
          done

      - name: Import the APT repository signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$APT_GPG_PRIVATE_KEY"
          export GNUPGHOME="$RUNNER_TEMP/apt-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "APT_GPG_KEY_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Build signed repository metadata
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg
          find build/apt-packages -type f -name '*.deb' -exec cp {} build/apt-packages/ \;
          repository-tools/scripts/build-apt-repository.sh build/apt-packages public/apt
          test -s public/apt/public.gpg
          test -s public/apt/dists/stable/InRelease

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
